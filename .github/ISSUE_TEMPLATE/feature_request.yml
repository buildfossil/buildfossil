name: Feature Request
description: Suggest an improvement to BuildFossil
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        BuildFossil is experimental and intentionally supports
        a narrow set of build configurations.

        Please describe the problem before proposing a solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or developer problem are you experiencing?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain your preferred approach.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Compatibility and security considerations
      description: Could this change the capsule format, trust boundaries, or replay behavior?
    validations:
      required: false
