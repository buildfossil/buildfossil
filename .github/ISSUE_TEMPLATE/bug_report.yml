name: Bug Report
description: Report a reproducible BuildFossil bug
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve BuildFossil.

        Please do not disclose security vulnerabilities here.
        Follow SECURITY.md for private vulnerability reporting.

  - type: input
    id: version
    attributes:
      label: BuildFossil version or commit
      placeholder: "buildfossil dev / commit SHA"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Capture
        - Capsule verification
        - Go dependencies
        - Replay
        - Docker runtime
        - CLI
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible example.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version and Docker version.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
      description: Remove secrets and sensitive information before submitting.
