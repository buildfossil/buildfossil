name: Publish Replay Base

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push replay image
        uses: docker/build-push-action@v6
        with:
          context: ./images/replay-base
          file: ./images/replay-base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/buildfossil/replay-base:0.1.0
