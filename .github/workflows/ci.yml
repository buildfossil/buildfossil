name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Linux AMD64 CLI
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o buildfossil ./cmd/buildfossil

  linux-e2e:
    name: Linux Docker E2E
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Docker availability
        run: |
          docker version
          docker info --format '{{.OSType}}/{{.Architecture}}'

      - name: Verify replay image is not preloaded
        run: |
          if docker image inspect \
            ghcr.io/buildfossil/replay-base@sha256:51ea5ed5cda2f1133ed5b0c07f7f26902e0ed7f9527671a3491525bbc080c944 \
            >/dev/null 2>&1; then
            echo "Replay image is already cached; cold-pull path not tested"
            exit 1
          fi

          echo "Replay image is absent; SDK must download it"

      - name: Run Capture and Replay v2 E2E
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -o pipefail

          go test -count=1 -v ./cmd/buildfossil \
            -run '^TestCaptureReplayV2EndToEnd$' \
            | tee /tmp/buildfossil-e2e.log

          if grep -q -- '--- SKIP: TestCaptureReplayV2EndToEnd' /tmp/buildfossil-e2e.log; then
            echo "E2E test was unexpectedly skipped"
            exit 1
          fi

      - name: Test Replay CLI SIGINT and cleanup
        shell: bash
        run: |
          set -o pipefail
          BUILDFOSSIL_DOCKER_TEST=1 go test \
            -count=1 \
            -v \
            -timeout 90s \
            ./cmd/buildfossil \
            -run '^TestReplayCLISIGINT$'

      - name: Test Docker sandbox security
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -o pipefail

          go test \
            -count=1 \
            -v \
            -timeout 90s \
            ./internal/runtime/docker \
            -run '^(TestSDKContainerSecurityConfiguration|TestSDKRunSecurityRestrictions|TestSDKRunContainerHasRunID)$'

      - name: Go runtime Docker E2E
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 180s \
            ./internal/runtime/docker \
            -run '^TestSDKGoRuntimeBuildFailure$' \
            | tee /tmp/buildfossil-go-runtime.log

          if grep -q -- '--- SKIP: TestSDKGoRuntimeBuildFailure' /tmp/buildfossil-go-runtime.log; then
            echo "Go runtime test was unexpectedly skipped"
            exit 1
          fi

          go test -count=1 -v -timeout 180s \
            ./internal/replay \
            -run '^TestReplayV2GoBuildIntegration$' \
            | tee /tmp/buildfossil-go-replay.log

          if grep -q -- '--- SKIP: TestReplayV2GoBuildIntegration' /tmp/buildfossil-go-replay.log; then
            echo "Go replay test was unexpectedly skipped"
            exit 1
          fi

      - name: Go Capture to Replay E2E
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 180s \
            ./cmd/buildfossil \
            -run '^TestCaptureReplayGoBuildEndToEnd$' \
            | tee /tmp/buildfossil-go-capture-e2e.log

          if ! grep -q -- '--- PASS: TestCaptureReplayGoBuildEndToEnd' \
            /tmp/buildfossil-go-capture-e2e.log; then
            echo "Go Capture/Replay E2E did not pass"
            exit 1
          fi

      - name: Schema v3 Docker runner E2E
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 8m \
            ./internal/runtime/docker \
            -run '^(TestSDKOfflineExecRunner|TestSDKOfflineExecCancelAfterCommandStarted)$' \
            | tee "$RUNNER_TEMP/buildfossil-v3-docker.log"

          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/buildfossil-v3-docker.log"; then
            echo "Schema v3 Docker tests were unexpectedly skipped"
            exit 1
          fi

      - name: Schema v3 Replay API and CLI E2E
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 5m \
            ./internal/replay \
            -run '^TestReplayV3OfflineGoFailure$' \
            | tee "$RUNNER_TEMP/buildfossil-v3-replay.log"

          if ! grep -q -- '--- PASS: TestReplayV3OfflineGoFailure' \
            "$RUNNER_TEMP/buildfossil-v3-replay.log"; then
            echo "Schema v3 Replay E2E did not pass"
            exit 1
          fi

          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/buildfossil-v3-replay.log"; then
            echo "Schema v3 Replay E2E was unexpectedly skipped"
            exit 1
          fi


  macos-capture:
    name: macOS ARM64 Go Capture
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify host platform
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          go version

      - name: Test Go Capture and environment metadata
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ""
        run: |
          set -euo pipefail

          go test -count=1 -v \
            ./cmd/buildfossil \
            -run '^TestCaptureV2DetectsGoRuntime$' \
            | tee /tmp/buildfossil-macos-capture.log

          if ! grep -q -- '--- PASS: TestCaptureV2DetectsGoRuntime' \
            /tmp/buildfossil-macos-capture.log; then
            echo "macOS Go Capture test did not pass"
            exit 1
          fi

      - name: Schema v3 Capture tests on macOS ARM64
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ""
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 3m \
            ./cmd/buildfossil \
            -run '^TestCaptureV3' \
            | tee "$RUNNER_TEMP/buildfossil-v3-macos-capture.log"

          if grep -q -- '--- FAIL:\|--- SKIP:' \
            "$RUNNER_TEMP/buildfossil-v3-macos-capture.log"; then
            echo "Schema v3 macOS Capture tests failed or skipped"
            exit 1
          fi

          if ! grep -q -- '--- PASS: TestCaptureV3CreatesVerifiedCapsule' \
            "$RUNNER_TEMP/buildfossil-v3-macos-capture.log"; then
            echo "Schema v3 Capture test did not pass"
            exit 1
          fi


  cross-platform-capture:
    name: Cross-platform Go Capture
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build BuildFossil CLI
        run: go build -o buildfossil ./cmd/buildfossil

      - name: Capture Go compilation failure
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ""
          GOOS: darwin
          GOARCH: arm64
        run: |
          set -euo pipefail

          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

          cd testdata/cross-platform-go

          set +e
          ../../buildfossil capture \
            --include go.mod \
            --include main.go \
            -- go build ./...
          capture_exit=$?
          set -e

          if [ "$capture_exit" -ne 1 ]; then
            echo "Unexpected capture exit: $capture_exit"
            exit 1
          fi

          test -s failure.bfc
          cp failure.bfc "$RUNNER_TEMP/cross-platform-go.bfc"

          echo "macOS capsule created successfully"

      - name: Upload captured capsule
        uses: actions/upload-artifact@v6
        with:
          name: cross-platform-go-capsule
          path: ${{ runner.temp }}/cross-platform-go.bfc
          if-no-files-found: error
          retention-days: 7

  cross-platform-replay:
    name: Cross-platform Go Replay
    runs-on: ubuntu-24.04
    needs: cross-platform-capture

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download macOS capsule
        uses: actions/download-artifact@v6
        with:
          name: cross-platform-go-capsule
          path: ${{ runner.temp }}/buildfossil-capsule

      - name: Build BuildFossil CLI
        run: go build -o buildfossil ./cmd/buildfossil

      - name: Replay macOS capsule in Linux Docker
        shell: bash
        run: |
          set -euo pipefail

          capsule="$RUNNER_TEMP/buildfossil-capsule/cross-platform-go.bfc"
          test -s "$capsule"

          docker version

          set +e
          ./buildfossil replay --v2 --allow-command "$capsule" \
            > "$RUNNER_TEMP/replay.stdout" \
            2> "$RUNNER_TEMP/replay.stderr"
          replay_exit=$?
          set -e

          echo "Replay exit code: $replay_exit"
          cat "$RUNNER_TEMP/replay.stdout"
          cat "$RUNNER_TEMP/replay.stderr"

          if [ "$replay_exit" -ne 0 ]; then
            echo "BuildFossil Replay failed"
            exit 1
          fi

          if ! grep -qi 'reproduced' "$RUNNER_TEMP/replay.stdout" \
             && ! grep -qi 'reproduced' "$RUNNER_TEMP/replay.stderr"; then
            echo "Expected REPRODUCED outcome"
            exit 1
          fi