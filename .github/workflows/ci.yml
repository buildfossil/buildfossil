name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Linux AMD64 CLI
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o buildfossil ./cmd/buildfossil

  linux-e2e:
    name: Linux Docker E2E
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Docker availability
        run: |
          docker version
          docker info --format '{{.OSType}}/{{.Architecture}}'

      - name: Verify replay image is not preloaded
        run: |
          if docker image inspect \
            ghcr.io/buildfossil/replay-base@sha256:51ea5ed5cda2f1133ed5b0c07f7f26902e0ed7f9527671a3491525bbc080c944 \
            >/dev/null 2>&1; then
            echo "Replay image is already cached; cold-pull path not tested"
            exit 1
          fi

          echo "Replay image is absent; SDK must download it"

      - name: Run Capture and Replay v2 E2E
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -o pipefail

          go test -count=1 -v ./cmd/buildfossil \
            -run '^TestCaptureReplayV2EndToEnd$' \
            | tee /tmp/buildfossil-e2e.log

          if grep -q -- '--- SKIP: TestCaptureReplayV2EndToEnd' /tmp/buildfossil-e2e.log; then
            echo "E2E test was unexpectedly skipped"
            exit 1
          fi

      - name: Test Replay CLI SIGINT and cleanup
        shell: bash
        run: |
          set -o pipefail
          BUILDFOSSIL_DOCKER_TEST=1 go test \
            -count=1 \
            -v \
            -timeout 90s \
            ./cmd/buildfossil \
            -run '^TestReplayCLISIGINT$'

      - name: Test Docker sandbox security
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -o pipefail

          go test \
            -count=1 \
            -v \
            -timeout 90s \
            ./internal/runtime/docker \
            -run '^(TestSDKContainerSecurityConfiguration|TestSDKRunSecurityRestrictions|TestSDKRunContainerHasRunID)$'

      - name: Go runtime Docker E2E
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 180s \
            ./internal/runtime/docker \
            -run '^TestSDKGoRuntimeBuildFailure$' \
            | tee /tmp/buildfossil-go-runtime.log

          if grep -q -- '--- SKIP: TestSDKGoRuntimeBuildFailure' /tmp/buildfossil-go-runtime.log; then
            echo "Go runtime test was unexpectedly skipped"
            exit 1
          fi

          go test -count=1 -v -timeout 180s \
            ./internal/replay \
            -run '^TestReplayV2GoBuildIntegration$' \
            | tee /tmp/buildfossil-go-replay.log

          if grep -q -- '--- SKIP: TestReplayV2GoBuildIntegration' /tmp/buildfossil-go-replay.log; then
            echo "Go replay test was unexpectedly skipped"
            exit 1
          fi

      - name: Go Capture to Replay E2E
        shell: bash
        env:
          BUILDFOSSIL_DOCKER_TEST: "1"
        run: |
          set -euo pipefail

          go test -count=1 -v -timeout 180s \
            ./cmd/buildfossil \
            -run '^TestCaptureReplayGoBuildEndToEnd$' \
            | tee /tmp/buildfossil-go-capture-e2e.log

          if ! grep -q -- '--- PASS: TestCaptureReplayGoBuildEndToEnd' \
            /tmp/buildfossil-go-capture-e2e.log; then
            echo "Go Capture/Replay E2E did not pass"
            exit 1
          fi

  macos-capture:
    name: macOS ARM64 Go Capture
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify host platform
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          go version

      - name: Test Go Capture and environment metadata
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ""
        run: |
          set -euo pipefail

          go test -count=1 -v \
            ./cmd/buildfossil \
            -run '^TestCaptureV2DetectsGoRuntime$' \
            | tee /tmp/buildfossil-macos-capture.log

          if ! grep -q -- '--- PASS: TestCaptureV2DetectsGoRuntime' \
            /tmp/buildfossil-macos-capture.log; then
            echo "macOS Go Capture test did not pass"
            exit 1
          fi